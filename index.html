<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>КЧЗ: Лабиринт</title>
<style>
:root{--bg:#0b0f1e;--fg:#e8eefc;--btn:#1f3a8a;--btnfg:#fff;--fire:#d7263d;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#dfe6fa;--fg:#0b0f1e;color-scheme:light}}
:root[data-theme="light"]{--bg:#dfe6fa;--fg:#0b0f1e;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:10px;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{width:min(100%,900px);aspect-ratio:8/5;image-rendering:pixelated;border:3px solid var(--fg);display:block;background:#000}
.stage{position:relative;width:min(100%,900px)}.stage canvas{width:100%;touch-action:none}.ctl{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;padding:8px;pointer-events:none}.ctl button{pointer-events:auto;opacity:.6}
.dp{display:grid;grid-template-columns:56px;grid-template-rows:repeat(2,56px);gap:6px}
button{font:inherit;font-size:24px;border:0;border-radius:14px;background:var(--btn);color:var(--btnfg);cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.4)}
button.on{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.4)}
button:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
#F{width:84px;height:84px;border-radius:42px;background:var(--fire);font-size:13px;font-weight:700}
.hint{font-size:12px;line-height:1.5;text-align:center;opacity:.75;margin:0;max-width:600px}
</style>
</head>
<body>
<div class="stage"><canvas id="c" aria-label="3D-лабиринт"></canvas>
<div class="ctl">
  <div class="dp">
    <button id="U" type="button" aria-label="Вперёд">▲</button>
    <button id="D" type="button" aria-label="Назад">▼</button>
  </div>
  <button id="F" type="button">ОГОНЬ</button>
</div></div>
<p class="hint">Поворот: води пальцем по экрану. Компьютер: W и S — вперёд и назад, мышь или ← → — поворот, пробел — огонь. Включи звук.</p>

const N=10,M=2*N+1,dirs=[[1,0],[-1,0],[0,1],[0,-1]];

function gen(){

  const st=[[0,0]];seen[0][0]=true;map[1][1]=0;

    if(!nb.length){st.pop();continue}

    seen[ny][nx]=true;map[2*ny+1][2*nx+1]=0;map[2*cy+1+d[1]][2*cx+1+d[0]]=0;st.push([nx,ny]);}
  for(let i=0;i<16;i++){const a=1+(Math.random()*(M-2)|0),b=1+(Math.random()*(M-2)|0);
    if(map[b][a]===1&&((map[b][a-1]===0&&map[b][a+1]===0)||(map[b-1][a]===0&&map[b+1][a]===0)))map[b][a]=0}
  map[M-2][M-2]=2;
}
function init(){

  for(let i=0;i<q.length;i++){const [x,y]=q[i];
    for(const [a,b] of dirs){const nx=x+a,ny=y+b;
      if(map[ny]&&map[ny][nx]===0&&D[ny][nx]<0){D[ny][nx]=D[y][x]+1;q.push([nx,ny])}}}
}

  if(EN.dead>0){EN.dead-=dt;if(EN.dead<=0)respawn();hurt=0;return}
  EN.stun=Math.max(0,EN.stun-dt);
  bfsT-=dt;if(bfsT<=0){bfs();bfsT=.2}
  if(!EN.stun){
    const ex=EN.x|0,ey=EN.y|0,px=P.x|0,py=P.y|0;let tx=P.x,ty=P.y;
    if(ex!==px||ey!==py){let best=1e9;
      for(const [a,b] of dirs){const nx=ex+a,ny=ey+b;
        if(D[ny]&&D[ny][nx]>=0&&D[ny][nx]<best){best=D[ny][nx];tx=nx+.5;ty=ny+.5}}}
    const vx=tx-EN.x,vy=ty-EN.y,l=Math.hypot(vx,vy)||1;
    EN.x+=vx/l*EN.sp*dt;EN.y+=vy/l*EN.sp*dt;
  }
  const d=Math.hypot(EN.x-P.x,EN.y-P.y);
  warnT-=dt;if(warnT<=0){say(WARN[Math.random()*WARN.length|0]);warnT=d<5?3+Math.random()*2:6+Math.random()*4}
  hurt=Math.max(0,Math.min(.5,(4-d)/7));
  if(d<.6&&!EN.stun)finish(false);
}
function txt(s,x,y,sz,col,al){g.font='bold '+sz+'px "Courier New",monospace';g.textAlign=al||'center';g.textBaseline='middle';g.fillStyle=col;g.fillText(s,x,y)}
function render(){
  let gr=g.createLinearGradient(0,0,0,SH/2);gr.addColorStop(0,'#02030a');gr.addColorStop(1,'#0d1224');
  g.fillStyle=gr;g.fillRect(0,0,SW,SH/2);
  gr=g.createLinearGradient(0,SH/2,0,SH);gr.addColorStop(0,'#05060d');gr.addColorStop(1,'#1a1f33');
  g.fillStyle=gr;g.fillRect(0,SH/2,SW,SH/2);
  const dx=Math.cos(P.a),dy=Math.sin(P.a),plx=-dy*.66,ply=dx*.66;
  for(let x=0;x<SW;x++){
    const cam=2*x/SW-1,rx=dx+plx*cam,ry=dy+ply*cam;
    let mx=P.x|0,my=P.y|0;const ddx=Math.abs(1/rx),ddy=Math.abs(1/ry);
    let sx,sy,sdx,sdy;
    if(rx<0){sx=-1;sdx=(P.x-mx)*ddx}else{sx=1;sdx=(mx+1-P.x)*ddx}
    if(ry<0){sy=-1;sdy=(P.y-my)*ddy}else{sy=1;sdy=(my+1-P.y)*ddy}
    let side=0,tile=0;
    while(!tile){if(sdx<sdy){sdx+=ddx;mx+=sx;side=0}else{sdy+=ddy;my+=sy;side=1}tile=map[my][mx]}
    const pd=side?sdy-ddy:sdx-ddx;zb[x]=pd;
    const lh=SH/pd,y0=SH/2-lh/2;
    let wx=side?P.x+pd*rx:P.y+pd*ry;wx-=Math.floor(wx);
    let col=tile===2?[40+30*Math.sin(T*5),230,110]:[45,80,160];
    let sh=1/(1+pd*pd*.12)*(side?.7:1);
    if(tile===1&&(wx*3%1<.06||wx>.97))sh*=.6;
    g.fillStyle='rgb('+(col[0]*sh|0)+','+(col[1]*sh|0)+','+(col[2]*sh|0)+')';
    g.fillRect(x,y0,1,lh+.5);
  }
  if(EN.dead<=0&&img.complete){
    const sx=EN.x-P.x,sy=EN.y-P.y,inv=1/(plx*dy-dx*ply);
    const tx=inv*(dy*sx-dx*sy),ty=inv*(-ply*sx+plx*sy);
    if(ty>.15){
      const scr=SW/2*(1+tx/ty),size=SH/ty*.9,cy=SH/2+Math.sin(T*3)*2,L=Math.floor(scr-size/2);
      for(let c=Math.max(0,L);c<Math.min(SW,L+size);c++){
        if(zb[c]<ty)continue;
        const u=(c-L)/size,h=Math.sqrt(Math.max(0,1-(2*u-1)**2));
        if(h<=0)continue;
        g.drawImage(img,u*img.width,(.5-h/2)*img.height,Math.max(1,img.width/size),h*img.height,c,cy-size*h/2,1,size*h);
        g.globalAlpha=Math.min(.75,ty*.07+(EN.stun?0:0));g.fillStyle='#05060d';g.fillRect(c,cy-size*h/2,1,size*h);g.globalAlpha=1;
      }
      if(EN.stun>0){g.fillStyle='rgba(255,255,255,.35)';g.beginPath();g.arc(scr,cy,size/2,0,7);g.fill()}
    }
  }
  if(hurt>0){g.fillStyle='rgba(215,38,61,'+hurt+')';g.fillRect(0,0,SW,SH)}
  // gun
  g.fillStyle='#555a6b';g.fillRect(SW/2-6,SH-26,12,26);g.fillStyle='#2b2f3d';g.fillRect(SW/2-3,SH-30,6,6);
  if(flash>0){g.fillStyle='#ffec27';g.fillRect(SW/2-8,SH-42,16,14);g.fillStyle='#fff1e8';g.fillRect(SW/2-4,SH-38,8,8)}
  g.fillStyle='#fff';g.fillRect(SW/2-1,SH/2-5,2,10);g.fillRect(SW/2-5,SH/2-1,10,2);
  // minimap
  const mm=3,ox=SW-M*mm-4,oy=4;
  g.fillStyle='rgba(0,0,0,.5)';g.fillRect(ox-1,oy-1,M*mm+2,M*mm+2);
  for(let y=0;y<M;y++)for(let x=0;x<M;x++)if(vis[y][x]){g.fillStyle=map[y][x]===1?'#2d4a9a':map[y][x]===2?'#2de07a':'#aab4d8';g.fillRect(ox+x*mm,oy+y*mm,mm,mm)}
  g.fillStyle='#ffec27';g.fillRect(ox+P.x*mm-1,oy+P.y*mm-1,3,3);
  if(EN.dead<=0&&Math.hypot(EN.x-P.x,EN.y-P.y)<6){g.fillStyle='#ff3355';g.fillRect(ox+EN.x*mm-1,oy+EN.y*mm-1,3,3)}
  // hud
  if(EN.dead<=0){g.fillStyle='#331';g.fillRect(6,6,60,6);g.fillStyle='#ff3355';g.fillRect(6,6,60*EN.hp/hpmax,6);txt('Варн',36,19,8,'#fff')}
  else txt('Варн ушёл. Ищи выход!',6,10,8,'#ffec27','left');
  txt(Math.floor(tm)+' с',6,SH-8,8,'#fff','left');
  if(subT>0)txt(sub.toUpperCase(),SW/2,SH-56,14,'#ff3355');
}
function overlay(a,b,c){
  g.fillStyle='rgba(5,6,13,.82)';g.fillRect(0,0,SW,SH);
  txt(a[0],SW/2,60,a[1],a[2]);
  b.forEach((s,i)=>txt(s,SW/2,100+i*16,9,'#e8eefc'));
  if(c)txt(c,SW/2,SH-30,9,'#ffec27');
}
let last=0;
function loop(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;T+=dt;
  if(state==='play')update(dt);else if(overT>0)overT-=dt;
  if(state==='menu'||state==='disc'){if(!loop.m){loop.m=1;gen();vis=Array.from({length:M},()=>Array(M).fill(true));P={x:1.5,y:1.5,a:0};EN={x:1.5,y:M-1.5,hp:1,stun:0,dead:1,sp:1}}P.a=T*.3}
  render();
  if(state==='disc'){g.fillStyle='rgba(5,6,13,.94)';g.fillRect(0,0,SW,SH);txt('ВНИМАНИЕ',SW/2,26,16,'#ffec27');['Данная игра была создана','МЕХА COMPANY','','Данная игра не хочет никого оскорбить.','Она создана для развлекательных целей.'].forEach((s,i)=>txt(s,SW/2,60+i*16,9,'#e8eefc'));txt('МЕХА COMPANY 2024',SW/2,152,10,'#7f8cc4');txt('Нажми, чтобы продолжить',SW/2,180,9,'#ffec27')}
  if(state==='menu')overlay(['КЧЗ: ЛАБИРИНТ',20,'#ffec27'],['За тобой идёт логотип и кричит «Варн!»','Стреляй в него и найди зелёный выход','Он вернётся сильнее, если его победить'],'Нажми ОГОНЬ, чтобы начать');
  if(state==='over')overlay(['ПОЙМАЛ!',24,'#ff3355'],['Варн тебя догнал'],overT<=0?'Нажми ОГОНЬ, чтобы сыграть ещё':'');
  if(state==='win')overlay(['ВЫХОД НАЙДЕН!',20,'#2de07a'],['Время: '+Math.floor(tm)+' с','Побеждено Варнов: '+kills],overT<=0?'Нажми ОГОНЬ, чтобы сыграть ещё':'');
  requestAnimationFrame(loop);
}
function tryStart(){if(state==='play')return;if(state==='disc'){state='menu';return}if(state==='menu'||overT<=0)init()}
function press(k,v){keys[k]=v;if(v){unlock();if(k==='f')tryStart()}}
[['U','u'],['D','d'],['F','f']].forEach(([id,k])=>{
  const el=document.getElementById(id);
  el.addEventListener('pointerdown',e=>{e.preventDefault();el.classList.add('on');press(k,1)});
  ['pointerup','pointercancel','pointerleave'].forEach(n=>el.addEventListener(n,()=>{el.classList.remove('on');keys[k]=0}))});
const KM={ArrowUp:'u',w:'u',W:'u','ц':'u',ArrowDown:'d',s:'d',S:'d','ы':'d',ArrowLeft:'l',a:'l',A:'l','ф':'l',ArrowRight:'r',d:'r',D:'r','в':'r',' ':'f',x:'f',X:'f',Enter:'f'};
addEventListener('keydown',e=>{const k=KM[e.key];if(k){e.preventDefault();press(k,1)}});
addEventListener('keyup',e=>{const k=KM[e.key];if(k)keys[k]=0});
let tp=null;
cv.addEventListener('pointerdown',e=>{e.preventDefault();unlock();tp={id:e.pointerId,x:e.clientX};try{cv.setPointerCapture(e.pointerId)}catch(_){}if(state!=='play')tryStart()});
cv.addEventListener('pointermove',e=>{if(tp&&tp.id===e.pointerId){if(state==='play')P.a+=(e.clientX-tp.x)*.008;tp.x=e.clientX}});
['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,e=>{if(tp&&tp.id===e.pointerId)tp=null}));
requestAnimationFrame(loop);
</script>
